<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="loveGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </radialGradient>
    <filter id="loveGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#heartGrad)"/>
  
  <!-- Floating hearts -->
  <g opacity="0.3">
    <path d="M30,40 C30,35 35,30 40,35 C45,30 50,35 50,40 C50,50 40,55 40,55 C40,55 30,50 30,40" fill="#f472b6" transform="translate(0,0) scale(0.5)"/>
    <path d="M160,60 C160,55 165,50 170,55 C175,50 180,55 180,60 C180,70 170,75 170,75 C170,75 160,70 160,60" fill="#f472b6" transform="scale(0.4)"/>
    <path d="M40,160 C40,155 45,150 50,155 C55,150 60,155 60,160 C60,170 50,175 50,175 C50,175 40,170 40,160" fill="#f472b6" transform="scale(0.3)"/>
  </g>
  
  <!-- Hexagonal border -->
  <polygon points="100,10 175,50 175,150 100,190 25,150 25,50" fill="none" stroke="#ec4899" stroke-width="3" opacity="0.5"/>
  
  <!-- Main heart with glow -->
  <g filter="url(#loveGlow)" transform="translate(100, 85)">
    <path d="M0,-30 C-25,-55 -60,-20 -30,15 C-15,35 0,50 0,50 C0,50 15,35 30,15 C60,-20 25,-55 0,-30" fill="url(#loveGrad)" transform="scale(1.2)">
      <animate attributeName="transform" dur="1s" values="scale(1.2);scale(1.3);scale(1.2)" repeatCount="indefinite"/>
    </path>
    
    <!-- Heart highlight -->
    <ellipse cx="-15" cy="-15" rx="10" ry="8" fill="#fff" opacity="0.3"/>
  </g>
  
  <!-- Comment bubbles -->
  <g transform="translate(35, 145)">
    <rect x="0" y="0" width="25" height="18" rx="4" fill="#238636"/>
    <circle cx="5" cy="12" r="3" fill="#0d1117"/>
    <circle cx="12" cy="12" r="3" fill="#0d1117"/>
    <circle cx="19" cy="12" r="3" fill="#0d1117"/>
  </g>
  
  <g transform="translate(140, 145)">
    <rect x="0" y="0" width="25" height="18" rx="4" fill="#238636"/>
    <circle cx="5" cy="12" r="3" fill="#0d1117"/>
    <circle cx="12" cy="12" r="3" fill="#0d1117"/>
    <circle cx="19" cy="12" r="3" fill="#0d1117"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" fill="#f472b6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">HEART COMMENTER</text>
</svg>
