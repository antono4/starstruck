<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#quickGrad)"/>
  
  <!-- Speed lines -->
  <g stroke="#58a6ff" stroke-width="2" opacity="0.3">
    <line x1="10" y1="50" x2="60" y2="50"/>
    <line x1="5" y1="100" x2="40" y2="100"/>
    <line x1="15" y1="150" x2="55" y2="150"/>
    <line x1="140" y1="50" x2="190" y2="50"/>
    <line x1="160" y1="100" x2="195" y2="100"/>
    <line x1="145" y1="150" x2="185" y2="150"/>
  </g>
  
  <!-- Hexagonal border -->
  <polygon points="100,10 175,50 175,150 100,190 25,150 25,50" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.5"/>
  
  <!-- Target/Bullseye -->
  <g transform="translate(100, 95)" filter="url(#pulseGlow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ef4444" stroke-width="3">
      <animate attributeName="r" dur="1s" values="50;55;50" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="1s" values="1;0.5;1" repeatCount="indefinite"/>
    </circle>
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#22c55e" stroke-width="3"/>
    <!-- Bullseye -->
    <circle cx="0" cy="0" r="8" fill="#ef4444">
      <animate attributeName="r" dur="0.5s" values="8;10;8" repeatCount="indefinite"/>
    </circle>
    
    <!-- Arrow -->
    <g transform="rotate(-45)">
      <line x1="30" y1="0" x2="75" y2="0" stroke="#58a6ff" stroke-width="4"/>
      <polygon points="0,-6 15,0 0,6" fill="#58a6ff"/>
      <!-- Arrow fletching -->
      <line x1="25" y1="-8" x2="35" y2="0" stroke="#58a6ff" stroke-width="2"/>
      <line x1="25" y1="8" x2="35" y2="0" stroke="#58a6ff" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Timer icon -->
  <g transform="translate(25, 25)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#fbbf24" stroke-width="2"/>
    <line x1="0" y1="0" x2="6" y2="3" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" fill="#ef4444" font-family="Arial, sans-serif" font-size="16" font-weight="bold">QUICKDRAW</text>
</svg>
