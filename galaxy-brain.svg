<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cosmosGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0515;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="brainGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#cosmosGrad)"/>
  
  <!-- Galaxy spiral effect -->
  <g opacity="0.3">
    <ellipse cx="100" cy="100" rx="80" ry="30" fill="none" stroke="#a855f7" stroke-width="1" transform="rotate(-20, 100, 100)"/>
    <ellipse cx="100" cy="100" rx="60" ry="22" fill="none" stroke="#c084fc" stroke-width="1" transform="rotate(-20, 100, 100)"/>
    <ellipse cx="100" cy="100" rx="40" ry="15" fill="none" stroke="#e879f9" stroke-width="1" transform="rotate(-20, 100, 100)"/>
  </g>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="1.5" fill="#fff"/>
  <circle cx="170" cy="50" r="1" fill="#fff"/>
  <circle cx="50" cy="160" r="1.5" fill="#fff"/>
  <circle cx="160" cy="150" r="1" fill="#fff"/>
  <circle cx="100" cy="25" r="2" fill="#f0abfc"/>
  <circle cx="20" cy="100" r="1" fill="#fff"/>
  <circle cx="180" cy="100" r="1" fill="#fff"/>
  
  <!-- Hexagonal border -->
  <polygon points="100,10 175,50 175,150 100,190 25,150 25,50" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
  
  <!-- Brain silhouette with galaxies inside -->
  <g filter="url(#neonGlow)" transform="translate(100, 95)">
    <!-- Brain base -->
    <ellipse cx="0" cy="0" rx="50" ry="40" fill="url(#brainGrad)" opacity="0.9"/>
    
    <!-- Neural connections (galaxy themed) -->
    <circle cx="-15" cy="-10" r="8" fill="#f0abfc" opacity="0.8">
      <animate attributeName="r" dur="2s" values="8;10;8" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="-5" r="6" fill="#c084fc" opacity="0.8">
      <animate attributeName="r" dur="2.5s" values="6;8;6" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="15" r="7" fill="#e879f9" opacity="0.8">
      <animate attributeName="r" dur="3s" values="7;9;7" repeatCount="indefinite"/>
    </circle>
    <circle cx="-20" cy="10" r="5" fill="#d946ef" opacity="0.8">
      <animate attributeName="r" dur="1.8s" values="5;7;5" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="12" r="5" fill="#f0abfc" opacity="0.8">
      <animate attributeName="r" dur="2.2s" values="5;7;5" repeatCount="indefinite"/>
    </circle>
    
    <!-- Mini galaxy inside brain -->
    <ellipse cx="-15" cy="-10" rx="12" ry="4" fill="none" stroke="#fff" stroke-width="0.5" transform="rotate(30, -15, -10)" opacity="0.5"/>
    <ellipse cx="15" cy="-5" rx="10" ry="3" fill="none" stroke="#fff" stroke-width="0.5" transform="rotate(-20, 15, -5)" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" fill="#e879f9" font-family="Arial, sans-serif" font-size="12" font-weight="bold">GALAXY BRAIN</text>
</svg>
