<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1a2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1628;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#facc15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#starGrad)"/>
  
  <!-- Background stars -->
  <circle cx="25" cy="35" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="175" cy="40" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="40" cy="170" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="165" cy="165" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="20" cy="100" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="180" cy="95" r="1" fill="#fff" opacity="0.4"/>
  
  <!-- Hexagonal border -->
  <polygon points="100,10 175,50 175,150 100,190 25,150 25,50" fill="none" stroke="#facc15" stroke-width="3" opacity="0.5"/>
  
  <!-- Central large star -->
  <g filter="url(#starGlow)" transform="translate(100, 90)">
    <polygon points="0,-45 10,-15 42,-15 18,5 28,38 0,20 -28,38 -18,5 -42,-15 -10,-15" fill="url(#goldGrad)" transform="scale(1.3)">
      <animate attributeName="transform" dur="2s" values="scale(1.3);scale(1.4);scale(1.3)" repeatCount="indefinite"/>
    </polygon>
    <!-- Inner glow -->
    <circle cx="0" cy="0" r="25" fill="#fef08a" opacity="0.3"/>
  </g>
  
  <!-- Orbiting stars -->
  <g>
    <polygon points="0,-12 3,-4 11,-4 5,1 7,9 0,5 -7,9 -5,1 -11,-4 -3,-4" fill="#fde047" transform="translate(45, 70)">
      <animateTransform attributeName="transform" type="rotate" from="0 45 70" to="360 45 70" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-12 3,-4 11,-4 5,1 7,9 0,5 -7,9 -5,1 -11,-4 -3,-4" fill="#fde047" transform="translate(155, 70)">
      <animateTransform attributeName="transform" type="rotate" from="0 155 70" to="360 155 70" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-12 3,-4 11,-4 5,1 7,9 0,5 -7,9 -5,1 -11,-4 -3,-4" fill="#fde047" transform="translate(100, 155)">
      <animateTransform attributeName="transform" type="rotate" from="0 100 155" to="360 100 155" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- 16+ text -->
  <g transform="translate(100, 45)">
    <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#facc15"/>
    <text x="0" y="5" text-anchor="middle" fill="#0d1628" font-family="Arial, sans-serif" font-size="14" font-weight="bold">16+</text>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" fill="#fde047" font-family="Arial, sans-serif" font-size="14" font-weight="bold">STARSTRUCK</text>
</svg>
