<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="santaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="giftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="giftGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with snow effect -->
  <rect width="200" height="200" rx="20" fill="url(#santaGrad)"/>
  
  <!-- Snowflakes -->
  <g fill="#fff" opacity="0.4">
    <circle cx="30" cy="30" r="1.5"/>
    <circle cx="170" cy="45" r="1"/>
    <circle cx="50" cy="80" r="1.5"/>
    <circle cx="150" cy="70" r="1"/>
    <circle cx="25" cy="130" r="1"/>
    <circle cx="175" cy="120" r="1.5"/>
    <circle cx="60" cy="160" r="1"/>
    <circle cx="140" cy="165" r="1"/>
  </g>
  
  <!-- Hexagonal border -->
  <polygon points="100,10 175,50 175,150 100,190 25,150 25,50" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.5"/>
  
  <!-- Gift box -->
  <g filter="url(#giftGlow)" transform="translate(100, 90)">
    <!-- Box -->
    <rect x="-35" y="-20" width="70" height="50" rx="5" fill="url(#giftGrad)"/>
    <!-- Lid -->
    <rect x="-40" y="-30" width="80" height="15" rx="3" fill="#dc2626"/>
    <!-- Ribbon vertical -->
    <rect x="-5" y="-30" width="10" height="60" fill="#22c55e"/>
    <!-- Ribbon horizontal -->
    <rect x="-40" y="-25" width="80" height="8" fill="#22c55e"/>
    <!-- Bow -->
    <ellipse cx="-15" cy="-35" rx="12" ry="8" fill="#22c55e"/>
    <ellipse cx="15" cy="-35" rx="12" ry="8" fill="#22c55e"/>
    <circle cx="0" cy="-35" r="5" fill="#16a34a"/>
  </g>
  
  <!-- Lock icon -->
  <g transform="translate(155, 45)">
    <rect x="-10" y="0" width="20" height="15" rx="3" fill="#fbbf24"/>
    <path d="M-6,0 L-6,-5 Q0,-12 6,-5 L6,0" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="0" cy="7" r="3" fill="#0d1628"/>
  </g>
  
  <!-- GPG Key icon -->
  <g transform="translate(45, 45)">
    <rect x="-10" y="-5" width="20" height="20" rx="3" fill="#60a5fa"/>
    <text x="0" y="8" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="monospace">PGP</text>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SECRET SANTA</text>
</svg>
